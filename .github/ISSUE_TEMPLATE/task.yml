name: Task
description: A feature, fix or other piece of work, written so a person or agent can pick it up without the conversation that produced it.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Measurable checks that show the work is done.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Likely files or area
  - type: textarea
    id: checks
    attributes:
      label: Checks to run
      description: Builds, tests or manual checks that validate the change.
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
