# Install this workflow in roswellien/MW3Recomp/.github/workflows/.
name: Publish MechLab updates

on:
  push:
    branches: [main]
    paths:
      - "docs/mechlab/**"
      - ".github/workflows/publish-mechlab.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-mechlab
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check website publishing credential
        env:
          WEBSITE_KEY: ${{ secrets.CORECRITICAL_WEBSITE_DEPLOY_KEY }}
        run: |
          if [ -z "$WEBSITE_KEY" ]; then
            echo "::error::CORECRITICAL_WEBSITE_DEPLOY_KEY is not configured."
            exit 1
          fi

      - name: Check out the website repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: roswellien/corecritical-website
          ref: main
          ssh-key: ${{ secrets.CORECRITICAL_WEBSITE_DEPLOY_KEY }}

      - name: Read public daily summaries from game main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/sync_mechlab.py

      - name: Publish changed update entries
        run: |
          git add -- data/mechlab.json
          if git diff --cached --quiet; then
            echo "The website already has the latest daily summaries."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Latest from the MechLab"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "::error::Website push failed after three attempts."
          exit 1
