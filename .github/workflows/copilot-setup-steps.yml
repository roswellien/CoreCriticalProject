# Prepares Copilot's cloud agent before each task: turns on the repository's git hooks
# (.githooks/) and installs the pinned formatters they use, so Copilot's commits come out
# formatted like everyone else's. GitHub runs this only from the default branch, and only
# the job named copilot-setup-steps. Copilot ignores job-level env:, so every value is
# written into its step. A failing step makes Copilot skip the rest, so the hooks come first.
name: Copilot setup steps

on:
  workflow_dispatch:
  # Run on changes to this file too, so a broken setup shows up in CI.
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Turn on the git hooks
        run: git config core.hooksPath .githooks
      # The .NET step below writes global.json at the root; keep it out of Copilot's commits.
      - name: Keep the generated global.json out of commits
        run: echo "/global.json" >> .git/info/exclude
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install Ruff and clang-format (hash-pinned)
        run: python -m pip install --require-hashes -r tools/style/requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
      - name: Install Prettier (lockfile-pinned)
        run: npm ci --prefix tools/style
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.425'
      # The runner has newer SDKs too; global.json makes dotnet use the pin, as in style.yml.
      # Also written to GITHUB_ENV, so later dotnet format runs from the hook send no telemetry
      # if Copilot's agent reads it.
      - name: Select the pinned .NET SDK
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> "$GITHUB_ENV"
          dotnet new globaljson --sdk-version 8.0.425 --roll-forward disable --force && dotnet --version
      - name: Install PSScriptAnalyzer (version pinned in check_powershell.ps1)
        run: pwsh -NoProfile -File tools/style/check_powershell.ps1 -Mode Install
