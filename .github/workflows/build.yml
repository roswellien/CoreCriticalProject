name: Bootstrap checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            compiler: msvc
          - os: ubuntu-24.04
            compiler: clang++
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Configure (MSVC)
        if: matrix.compiler == 'msvc'
        run: cmake --preset default -A x64
      - name: Configure (Clang)
        if: matrix.compiler != 'msvc'
        run: cmake --preset default -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build --preset default
      - run: ctest --preset default
      - name: Check C++ formatting (Clang)
        if: matrix.compiler != 'msvc'
        run: cmake --build build/default --target format-check
