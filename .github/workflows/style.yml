name: Bootstrap style checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  # Style counts for every language (tools/style/README.md). Checks are report-only until
  # listed in ENFORCED in tools/style/check_style.py; a broken checker always fails.
  style:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_SDK_VERSION: '8.0.425'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install Ruff and clang-format (hash-pinned)
        run: python -m pip install --require-hashes -r tools/style/requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
      - name: Install Prettier (lockfile-pinned)
        run: npm ci --prefix tools/style
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
      # The runner has newer SDKs too; this job-only global.json makes dotnet use the pin.
      - name: Select the pinned .NET SDK
        run: dotnet new globaljson --sdk-version "$DOTNET_SDK_VERSION" --roll-forward disable --force && dotnet --version
      - name: Install PSScriptAnalyzer (version pinned in check_powershell.ps1)
        run: pwsh -NoProfile -File tools/style/check_powershell.ps1 -Mode Install
      - name: Style checks
        run: python tools/style/check_style.py
